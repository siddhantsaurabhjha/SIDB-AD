<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="inner-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#090d16" stroke="url(#primary-grad)" stroke-width="2" />
  
  <!-- Stylized Geometric S / Orbit Browser Core -->
  <path d="M42 22C42 17.5817 38.4183 14 34 14H26C20.4772 14 16 18.4772 16 24C16 28.5 19.5 31.5 24 32.5L38 35.5C43 36.5 48 39.5 48 45C48 50.5228 43.5228 55 38 55H28C23.5817 55 20 51.4183 20 47" 
        stroke="url(#primary-grad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  
  <!-- Orbit dot / pulse -->
  <circle cx="44" cy="22" r="3" fill="#38bdf8" />
  <circle cx="20" cy="47" r="3" fill="#c084fc" />
</svg>

